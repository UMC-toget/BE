name: CI/CD PipeLine (Docker) - Dev

on:
  push:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: develop 체크아웃
        uses: actions/checkout@v4

      - name: 자바 설정
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: gradle 세팅
        uses: gradle/actions/setup-gradle@v4

      - name: gradle 빌드
        run: ./gradlew clean build -x test

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGENAME }}:dev
          platforms: linux/amd64, linux/arm64

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: EC2에 Docker Image 배포 (개발 서버)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          script: |
            sudo docker stop ${{ secrets.DOCKER_IMAGENAME }}-dev || true
            sudo docker rm ${{ secrets.DOCKER_IMAGENAME }}-dev || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGENAME }}:dev
            echo "${{ secrets.DEV_ENV }}" > .env
            sudo docker run -it -d --network host --name ${{ secrets.DOCKER_IMAGENAME }}-dev --env-file .env ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGENAME }}:dev
            rm .env
